<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>信息整合台 · 服务未启动</title>
    <!--
      服务没在跑时由 sw.js 兜底的页面。
      必须完全自包含：此时服务端不可用，任何外部资源都取不到。
      所以样式内联，不引用打包产物里的 assets。
    -->
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        background: #faf8f3;
        color: #33302a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", sans-serif;
        font-size: 14px;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
      }

      .sheet {
        width: min(520px, 100%);
        padding: 34px 38px;
        border: 1px solid #e8e2d6;
        border-radius: 10px;
        background: #fffefb;
        box-shadow: 0 1px 3px rgba(51, 48, 42, 0.05), 0 8px 24px rgba(51, 48, 42, 0.04);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      p {
        margin: 0 0 18px;
        color: #6f6a5f;
        font-size: 13.5px;
        line-height: 1.75;
      }

      ol {
        margin: 0 0 22px;
        padding-left: 20px;
        color: #4a463d;
        font-size: 13.5px;
        line-height: 1.9;
      }

      code {
        padding: 1px 6px;
        border-radius: 5px;
        background: #f5f2ea;
        font-family: "SFMono-Regular", Consolas, monospace;
        font-size: 12.5px;
      }

      button {
        padding: 7px 18px;
        border: 1px solid rgba(180, 100, 63, 0.5);
        border-radius: 999px;
        background: rgba(180, 100, 63, 0.08);
        color: #b4643f;
        font-family: inherit;
        font-size: 13px;
        cursor: pointer;
      }

      button:hover {
        background: rgba(180, 100, 63, 0.15);
      }
    </style>
  </head>
  <body>
    <main class="sheet">
      <h1>服务没有在运行</h1>
      <p>
        信息卡数据、AI 调用和界面的响应都来自本机的服务端进程。服务没起来时，
        这个窗口没有内容可以显示——你的数据都还在，没有丢。
      </p>
      <ol>
        <li>回到项目目录，双击 <code>启动信息整合台.bat</code></li>
        <li>等它提示服务已就绪，再点下面的「重新加载」</li>
      </ol>
      <button type="button" onclick="location.reload()">重新加载</button>
    </main>
  </body>
</html>
